<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetNavi - Node Command Center</title>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.3; }
            50% { opacity: 0.9; }
            100% { opacity: 0.3; }
        }

        body {
            background-color: #000000;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: #000000;
        }

        .dashboard-container {
            position: relative;
            z-index: 10;
            background: rgba(6, 6, 6, 0.9);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-radius: 32px;
            border: 1px solid rgba(6, 78, 59, 0.4);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.95),
                0 0 40px rgba(6, 78, 59, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -2px 6px rgba(0, 0, 0, 0.95);
            padding: 35px 30px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: 20px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #10b981;
            background: rgba(6, 78, 59, 0.15);
            border: 1px solid rgba(6, 78, 59, 0.4);
            padding: 8px 14px;
            border-radius: 50px;
            margin-bottom: 20px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulseGlow 2s infinite;
        }

        .digital-clock-box {
            background: rgba(2, 2, 2, 0.85);
            border: 1px solid rgba(6, 78, 59, 0.3);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .digital-time {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            font-family: 'Segoe UI', monospace;
        }

        .digital-time .ampm {
            font-size: 14px;
            color: #10b981;
            margin-left: 4px;
        }

        .digital-date {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
            font-weight: 600;
        }

        h2 { 
            text-align: center; 
            margin: 0 0 18px 0; 
            color: #f8fafc; 
            font-size: 20px; 
            font-weight: 600; 
        }

        .node-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-card {
            background: rgba(2, 2, 2, 0.7);
            border: 1px solid rgba(6, 78, 59, 0.3);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .info-label {
            font-size: 9px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 13px;
            color: #10b981;
            font-weight: 600;
            font-family: monospace;
        }

        .action-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #064e3b, #050505);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: white;
            padding: 14px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            margin-top: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
        }

        .action-link:hover {
            background: linear-gradient(135deg, #065f46, #121212);
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(16, 185, 129, 0.2);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #64748b;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <div class="dashboard-container">
        <div class="status-badge">
            <div class="status-dot"></div> Node Online & Secure
        </div>

        <div class="digital-clock-box">
            <div class="digital-time" id="digitalTime">00:00:00 <span class="ampm" id="ampmText">AM</span></div>
            <div class="digital-date" id="dateDisplay">Syncing...</div>
        </div>

        <h2>Node Command Center</h2>

        <div class="node-info-grid">
            <div class="info-card">
                <div class="info-label">Node Hostname</div>
                <div class="info-value">my-termux</div>
            </div>
            <div class="info-card">
                <div class="info-label">Tailscale IP</div>
                <div class="info-value">100.72.191.30</div>
            </div>
            <div class="info-card">
                <div class="info-label">Active Port</div>
                <div class="info-value">8080</div>
            </div>
            <div class="info-card">
                <div class="info-label">Daemon Status</div>
                <div class="info-value" style="color: #10b981;">HEALTHY</div>
            </div>
        </div>

        <a href="https://darkportal.page.gd" target="_blank" class="action-link">
            ðŸŒ Return to Portal Gateway
        </a>

        <div class="back-link">
            <a href="http://100.72.191.30:8080">Refresh Telemetry</a>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            const formattedHours = String(hours).padStart(2, '0');
            
            document.getElementById('digitalTime').innerHTML = `${formattedHours}:${minutes}:${seconds} <span class="ampm">${ampm}</span>`;
            
            const options = { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const characters = '01ABCDEF0123456789<>/\\_[]{}*&^%$#@!NODE_ACTIVE';
        const fontSize = 14;
        const columns = Math.floor(width / fontSize);
        const drops = [];
        for (let i = 0; i < columns; i++) drops[i] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillStyle = Math.random() > 0.85 ? '#10b981' : '#064e3b';
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#064e3b';
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);
    </script>
</body>
</html>
