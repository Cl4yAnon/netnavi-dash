<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetNavi Dash - PET Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #000000;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            z-index: 10;
            position: relative;
        }
        .netnavi-card {
            background: rgba(6, 78, 59, 0.4);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(0, 255, 128, 0.3);
            border-radius: 16px;
            padding: 24px;
            color: #00ff80;
            box-shadow: 0 0 30px rgba(0, 255, 128, 0.15);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(0, 255, 128, 0.2);
            padding-bottom: 12px;
            margin-bottom: 16px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff80;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff80;
            animation: pulseGlow 1.5s infinite;
        }
        .terminal-screen {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(0, 255, 128, 0.2);
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        .action-btn {
            background: rgba(0, 255, 128, 0.1);
            border: 1px solid #00ff80;
            color: #00ff80;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            width: 100%;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .action-btn:active {
            background: rgba(0, 255, 128, 0.3);
            box-shadow: 0 0 15px #00ff80;
        }
        @keyframes pulseGlow {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="netnavi-card">
            <div class="card-header">
                <span class="status-dot"></span>
                <span>NET_NAVI // SYSTEM_HUD</span>
            </div>
            <div class="terminal-screen" id="terminalLog">
                <p>[SYSTEM] PET OS kernel loaded successfully.</p>
                <p>[READY] Awaiting operator command...</p>
            </div>
            <button class="action-btn" onclick="executeScan()">EXECUTE NETWORK SCAN</button>
        </div>
    </div>

    <script>
        function executeScan() {
            const screen = document.getElementById('terminalLog');
            screen.innerHTML = '<p style="color: #00ff80;">[+] Initializing subnet sweep...</p>';
            
            const logs = [
                "[*] Probing local gateway...",
                "[+] Target acquired: 192.168.8.1 [Online]",
                "[!] Checking open ports...",
                "    -> Port 22 (SSH): OPEN",
                "    -> Port 80 (HTTP): OPEN",
                "    -> Port 8080 (Proxy): FILTERED",
                "[SUCCESS] Secure tunnel established. System verified."
            ];

            let i = 0;
            const timer = setInterval(() => {
                if (i < logs.length) {
                    const p = document.createElement('p');
                    p.textContent = logs[i];
                    if (logs[i].includes('SUCCESS')) p.style.color = '#00ffcc';
                    if (logs[i].includes('!')) p.style.color = '#ffaa00';
                    screen.appendChild(p);
                    screen.scrollTop = screen.scrollHeight;
                    i++;
                } else {
                    clearInterval(timer);
                }
            }, 500);
        }
    </script>
</body>
</html>
